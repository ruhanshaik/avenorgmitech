        <div class="nav-right">
            <a href="letstalk.html" class="lets-talk">Let's Talk</a>
        </div>
    </div>

<main style="padding: 4rem 2rem;">
    <div class="form-container" style="max-width: 600px;">
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">Let's Talk</h1>
        <p style="color: #aaa; margin-bottom: 2rem;">Fill out the form below and we'll connect with you on WhatsApp.</p>
        
        <form id="talkForm" onsubmit="submitTalkForm(event)">
            <div class="form-group"><label>Full Name <span class="required-star">*</span></label><input type="text" name="name" required></div>
            <div class="form-group"><label>Email <span class="required-star">*</span></label><input type="email" name="email" required></div>
            <div class="form-group"><label>Phone Number <span class="required-star">*</span></label><input type="tel" name="phone" required></div>
            <div class="form-group"><label>Company / Startup Name</label><input type="text" name="company"></div>
            <div class="form-group"><label>Message <span class="required-star">*</span></label><textarea name="message" rows="4" placeholder="What would you like to discuss?" required></textarea></div>
            <button type="submit" class="btn-submit">Send via WhatsApp →</button>
        </form>
    </div>
</main>

<script>
function submitTalkForm(event) {
    event.preventDefault();
    
    const name = document.querySelector('[name="name"]').value;
    const email = document.querySelector('[name="email"]').value;
    const phone = document.querySelector('[name="phone"]').value;
    const company = document.querySelector('[name="company"]').value;
    const message = document.querySelector('[name="message"]').value;
    
    const whatsappMsg = `👋 *New Contact from Verdict Website*\n\n*Name:* ${name}\n*Email:* ${email}\n*Phone:* ${phone}\n*Company:* ${company || 'Not specified'}\n*Message:* ${message}`;
    
    const whatsappNumber = "9262244607";
    window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(whatsappMsg)}`, '_blank');
}
</script>
</body>
